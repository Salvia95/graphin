{{define "title"}}로그 — graphin admin{{end}}
{{define "content"}}
<h1>로그</h1>
<p class="muted small">인덱서·워처·임베딩 파이프라인의 구조화 이벤트(<code>.graphin/agent-nav.log</code> tail,
3초 갱신). 에이전트가 작업하는 동안 무슨 일이 일어나는지 실시간으로 보여줍니다.</p>

<div class="controls">
  <label>이벤트
    <select id="logfilter" name="event" hx-get="/partial/logs" hx-target="#logbody">
      <option value="">전체</option>
      {{$cur := .Logs.Filter}}
      {{range .Logs.Names}}
      <option value="{{.}}" {{if eq . $cur}}selected{{end}}>{{.}}</option>
      {{end}}
    </select>
  </label>
</div>

<div id="logbody" hx-get="/partial/logs" hx-trigger="every 3s" hx-include="#logfilter">
{{template "logs.html" .Logs}}
</div>
{{end}}
