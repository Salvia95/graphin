{{define "tree_rows.html"}}
<ul role="group">
{{range .}}
<li data-depth="{{.Depth}}" role="treeitem" aria-level="{{add .Depth 1}}"
    {{if .Children}}class="collapsed" aria-expanded="false"{{end}}>
  <div class="tnode">
    <span class="tlabel">
      {{if .Children}}
      <button type="button" class="caret" aria-expanded="false"
              aria-label="{{.Label}} 펼치기"
              hx-get="{{.ChildURL}}" hx-trigger="click once"
              hx-target="closest li" hx-swap="beforeend">▸</button>
      {{else}}
      <span class="caret leaf" aria-hidden="true">·</span>
      {{end}}
      {{if .LinkURL}}
      <a class="nodelink mono" href="{{.LinkURL}}" title="{{.Title}}">{{.Label}}</a>
      {{else}}
      <code title="{{.Title}}">{{.Label}}</code>
      {{end}}
    </span>
    <span class="tkind">{{.Kind}}</span>
    <span class="tnum" title="{{.MetricTitle}}">{{comma .Metric}}</span>
    <span class="tstate">{{if .Partial}}<span class="tag warn">부분</span>{{end}}</span>
  </div>
</li>
{{end}}
</ul>
{{end}}
