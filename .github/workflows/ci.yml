name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # ubuntu-22.04, not -latest: the release build pins its glibc floor and CI
    # should compile against something no newer than what we ship.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # tree-sitter and its five grammar bindings are cgo; a build without a C
      # toolchain would fail here rather than at some later, stranger place.
      - name: Toolchain
        run: |
          go version
          cc --version | head -1
          echo "CGO_ENABLED=$(go env CGO_ENABLED)"

      - run: go vet ./...

      - run: go test ./...

      # Concurrency-heavy packages only — the full suite under -race is slow
      # and adds nothing for the single-threaded parsers.
      - run: make test-race

  # Both linters live in one job on purpose: actionlint shells out to
  # shellcheck for the `run:` blocks it finds, and the runner image already
  # has shellcheck on PATH. Splitting them would silently lose that half.
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No -s override: the plugin's hooks and launcher declare #!/bin/sh and
      # shellcheck reads that, so bashisms in them are caught. Forcing -s sh
      # would instead flag scripts/fetch-flatc.sh, which is deliberately bash.
      #
      # This is the only thing standing between a syntax error in a hook and a
      # silent no-op: hook stderr is swallowed and every path exits 0.
      - name: shellcheck
        run: |
          shellcheck --version
          # shellcheck disable=SC2046  # paths in this repo have no spaces
          shellcheck $(git ls-files '*.sh')

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # release.yml is workflow_dispatch-only, so a typo in it stays invisible
      # until the day of a release — the worst possible moment to discover that
      # an expression does not parse. This is the only thing that reads those
      # files on an ordinary push.
      #
      # Pinned, not @latest: a lint tool that floats turns an unrelated push
      # red the day upstream adds a rule.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  # Every version invariant lives here, because they are not independent: the
  # two plugins are versioned by opposite mechanisms and the failure modes are
  # mirror images (docs/plugin-distribution.md §13).
  #
  # The marketplace serves BOTH plugins from main — measured, not assumed: the
  # recorded gitCommitSha for graphin-guide was a plain main commit with no tag
  # on it. A tag only labels the release assets. So what a user receives is
  # whatever main holds, and the version field is the only thing that makes
  # Claude Code offer it.
  plugin-versions:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # graphin's version is stamped by the release workflow, never by hand,
      # and the manifest is written in the same step. If these two disagree,
      # either someone bumped plugin.json by hand — shipping new commands with
      # the old pinned binary, so /plugin and /graphin:doctor would report
      # different versions of the same install — or a release died between its
      # two writes. Both are worth stopping.
      - name: graphin plugin.json and install manifest must agree
        run: |
          set -eu
          p=plugin/graphin/.claude-plugin/plugin.json
          m=plugin/graphin/install/manifest.json
          if [ ! -f "$m" ]; then
            echo "::notice::$m does not exist yet — nothing to compare"
            exit 0
          fi
          pv="$(jq -r '.version // empty' "$p")"
          mv="$(jq -r '.version // empty' "$m")"
          if [ -z "$pv" ] || [ -z "$mv" ]; then
            echo "::error::could not read a version from $p ($pv) or $m ($mv)"
            exit 1
          fi
          if [ "$pv" != "$mv" ]; then
            echo "::error file=${p}::plugin.json says ${pv} but the install manifest says ${mv}. These are written together by the release workflow and must never be edited by hand — the manifest is what pins the binary, so a mismatch ships one version's commands with another version's binary. Run the release workflow instead."
            exit 1
          fi
          echo "graphin ${pv} — plugin.json and manifest agree"

      - name: Require a version bump when graphin-guide changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          manifest=plugin/graphin-guide/.claude-plugin/plugin.json
          version_of() { sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' | head -n1; }

          # A brand-new branch reports an all-zero "before"; nothing to compare.
          case "${BASE:-}" in
            "" | 0000000000000000000000000000000000000000)
              echo "::notice::no base commit to diff against — skipping"
              exit 0
              ;;
          esac
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::notice::base ${BASE} not in this clone — skipping"
            exit 0
          fi

          if [ -z "$(git diff --name-only "$BASE" HEAD -- plugin/graphin-guide/)" ]; then
            echo "graphin-guide untouched"
            exit 0
          fi

          old="$(git show "$BASE:$manifest" 2>/dev/null | version_of || true)"
          new="$(version_of < "$manifest")"
          if [ -z "$old" ]; then
            echo "::notice::graphin-guide manifest is new — nothing to compare"
            exit 0
          fi
          if [ "$old" = "$new" ]; then
            echo "::error file=${manifest}::graphin-guide changed but its version is still ${new}. Claude Code only offers an update when this field changes, so users would never receive the edit. Bump it."
            git diff --name-only "$BASE" HEAD -- plugin/graphin-guide/ | sed 's/^/  changed: /'
            exit 1
          fi
          echo "graphin-guide ${old} → ${new}"

      # The mirror image of the guide guard, and deliberately NOT an error.
      # For graphin the hand bump is the wrong move (the step above rejects
      # it) — a release is the delivery step. But the same silence applies:
      # commands, hooks and .mcp.json edited on main reach nobody until a
      # release stamps a new version, and nothing else says so out loud.
      #
      # Compared against the last release TAG, not against this push's base.
      # A per-push diff says it once and then forgets; whoever ignored it gets
      # no second warning, and the drift is invisible from then on. Diffing
      # from the tag makes it a standing signal that repeats on every push
      # until a release clears it.
      - name: Note graphin plugin changes that are not shipped yet
        run: |
          set -eu
          p=plugin/graphin/.claude-plugin/plugin.json
          pv="$(jq -r '.version // empty' "$p")"
          tag="v${pv}"
          if ! git rev-parse -q --verify "refs/tags/${tag}^{commit}" > /dev/null; then
            echo "::notice::no ${tag} tag in this clone — nothing to compare"
            exit 0
          fi

          # Both files are written by the release workflow itself; counting
          # them would make every release look like pending work.
          changed="$(git diff --name-only "$tag" HEAD -- plugin/graphin/ \
            ':!plugin/graphin/install/manifest.json' \
            ':!plugin/graphin/.claude-plugin/plugin.json')"
          if [ -z "$changed" ]; then
            echo "graphin plugin matches ${tag} — nothing pending"
            exit 0
          fi
          n="$(printf '%s\n' "$changed" | wc -l | tr -d ' ')"
          echo "::notice::${n} graphin plugin file(s) changed since ${tag} and are NOT shipped. Users receive them when the next release stamps a new version — see docs/plugin-distribution.md §13."
          printf '%s\n' "$changed" | sed 's/^/  pending: /'

  # Everything above tests the source tree. This tests the *release*: the
  # published manifest, the published asset, and install.sh — the three things
  # a user actually runs, none of which the Go test suite can reach.
  #
  # It closes three holes at once (docs/plugin-distribution.md §10):
  #   - linux/arm64 had never had its install path executed anywhere. The
  #     release workflow runs `graphin version` on a native arm64 runner, but
  #     nothing had ever downloaded, verified and unpacked the arm64 asset.
  #   - the glibc floor was printed by the release workflow, never asserted.
  #     Running the shipped binary on bullseye (2.31) IS the assertion.
  #   - a manifest whose sha256 no longer matches its asset would have been
  #     found by a user first.
  #
  # The container deliberately has neither go nor cc: install.sh's go_install
  # fallback then cannot fire, so a broken download fails this job instead of
  # quietly compiling its way to green.
  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    container:
      image: debian:bullseye
    steps:
      - name: Prerequisites
        run: |
          set -eu
          # Debian 11 LTS ends 2026-08-31, after which the suite leaves
          # deb.debian.org for archive.debian.org and apt-get update fails.
          # Detect that rather than timing it — and do NOT "fix" it by moving
          # to bookworm: that raises the glibc floor 2.31 → 2.36 and drops
          # RHEL 9 and AL2023, which is the whole reason this image is here.
          if ! apt-get update; then
            echo "::notice::bullseye has left the mirrors — falling back to archive.debian.org"
            printf '%s\n' \
              'deb http://archive.debian.org/debian bullseye main' \
              'deb http://archive.debian.org/debian-security bullseye-security main' \
              > /etc/apt/sources.list
            rm -f /etc/apt/sources.list.d/*.list || true
            apt-get -o Acquire::Check-Valid-Until=false update
          fi
          apt-get install -y --no-install-recommends ca-certificates curl git jq
          ldd --version | head -1

      - uses: actions/checkout@v4

      - name: Install from the published release
        run: |
          set -eu
          DATA="$(mktemp -d)"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          # install.sh logs to stdout; only the launcher redirects it to a file.
          CLAUDE_PLUGIN_ROOT="$PWD/plugin/graphin" CLAUDE_PLUGIN_DATA="$DATA" \
            sh plugin/graphin/install/install.sh | tee install.log

      - name: Assert what was installed
        run: |
          set -eu
          want="$(jq -r .version plugin/graphin/install/manifest.json)"

          # A symlink, not a copy: overwriting a running binary in place is
          # ETXTBSY, and the upgrade path depends on swapping this link.
          [ -L "$DATA/bin/graphin" ] || {
            echo "::error::$DATA/bin/graphin is not a symlink"; exit 1; }

          src="$(jq -r .source "$DATA/state/installed.json")"
          [ "$src" = "release" ] || {
            echo "::error::installed from '$src', not the published release asset"
            cat install.log; exit 1; }

          "$DATA/bin/graphin" version --json | tee v.json
          jq -e --arg v "$want" --arg a "${{ matrix.arch }}" \
            '.version == $v and .os == "linux" and .arch == $a and .semantic_supported == true' \
            v.json > /dev/null

      - name: The fast path must stay a no-op
        run: |
          set -eu
          # An identical manifest means an identical install: the second run
          # must print nothing and download nothing. Regressing this turns
          # every session start into a 25MB fetch.
          out="$(CLAUDE_PLUGIN_ROOT="$PWD/plugin/graphin" CLAUDE_PLUGIN_DATA="$DATA" \
            sh plugin/graphin/install/install.sh 2>&1)"
          [ -z "$out" ] || {
            echo "::error::second run was not a no-op"; printf '%s\n' "$out"; exit 1; }
