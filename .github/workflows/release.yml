name: Release

# ─────────────────────────────────────────────────────────────────────────────
# workflow_dispatch, NOT a tag trigger. Do not "fix" this.
#
# The plugin's install/manifest.json has to carry the SHA256 of release assets
# that do not exist until this workflow builds them, and the marketplace serves
# the plugin from the *tagged* tree. A tag trigger is therefore a chicken-and-egg:
# the tag would have to exist before the hashes it must contain.
#
# So the order is inverted on purpose: build → hash → write the manifest →
# commit → tag that commit → publish. The assets are built from the tag's
# *parent* commit. The only difference between the two trees is the manifest and
# the plugin version string, and neither reaches the compiler.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, no leading v (e.g. 1.0.0)"
        required: true
        type: string
      notes:
        description: "Prelude above the generated notes. Say it here if the upgrade costs the user something — a full re-index, a renamed option, a raised Claude Code floor."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The console interface is built here and NOT in the build job.
  #
  # That job runs inside debian:bullseye for one reason — a glibc 2.31 floor —
  # and putting a node toolchain in there would put the only constraint that
  # container exists to hold at the mercy of an unrelated dependency. The
  # frontend produces static files; nothing about them cares which libc built
  # them, so they cross as an artifact instead.
  ui:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/console/ui/package-lock.json
      - name: Build the console interface
        working-directory: internal/console/ui
        run: |
          set -eu
          npm ci
          npm run build
          test -f dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: console-ui
          path: internal/console/ui/dist
          retention-days: 1
          if-no-files-found: error

  build:
    needs: ui
    strategy:
      fail-fast: true
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-22.04
          # Native arm64 runner. Cross-compilation is not an option here:
          # go-tree-sitter and five grammar bindings compile vendored C through
          # cgo, and onnxruntime_go links -ldl, so CGO_ENABLED=1 plus a real C
          # toolchain per target is mandatory.
          - goarch: arm64
            runner: ubuntu-22.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    # glibc floor, the most likely field failure. Building on the runner image
    # itself (Ubuntu 22.04, glibc 2.35) would already break RHEL 9 and AL2023,
    # both on 2.34. bullseye's 2.31 clears every currently supported distro.
    container:
      image: debian:bullseye

    steps:
      - name: Install build prerequisites
        run: |
          set -eu
          # Debian 11 LTS ends 2026-08-31. After that the suite moves off
          # deb.debian.org to archive.debian.org and this step fails — which
          # would take the whole release pipeline with it. Detect it instead
          # of timing it.
          #
          # Do NOT resolve this by bumping to bookworm: that raises the glibc
          # floor from 2.31 to 2.36 and drops RHEL 9 and AL2023 (both 2.34),
          # which is the only reason this container exists.
          if ! apt-get update; then
            echo "::notice::bullseye has left the mirrors — falling back to archive.debian.org"
            printf '%s\n' \
              'deb http://archive.debian.org/debian bullseye main' \
              'deb http://archive.debian.org/debian-security bullseye-security main' \
              > /etc/apt/sources.list
            rm -f /etc/apt/sources.list.d/*.list || true
            apt-get -o Acquire::Check-Valid-Until=false update
          fi
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git jq xz-utils
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      # After checkout, which would otherwise wipe the directory. //go:embed
      # reads this at compile time, so it has to be in place before `make build`.
      - uses: actions/download-artifact@v4
        with:
          name: console-ui
          path: internal/console/ui/dist

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "1"
          VER: ${{ inputs.version }}
        run: |
          set -eu
          # A missing interface is not a build error — the binary would ship
          # with the "not built yet" page and nothing would say so until a user
          # opened it. Fail here instead.
          test -f internal/console/ui/dist/index.html
          # Command-line variables override the Makefile's git-describe
          # defaults, so the release stamp is exactly the dispatched version.
          # Build flags themselves stay defined in one place: the Makefile.
          # (It must never grow -extldflags -static — onnxruntime is dlopen'd.)
          make build \
            VERSION="$VER" \
            COMMIT="$(echo "$GITHUB_SHA" | cut -c1-7)" \
            BUILDDATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mv bin/graphin ./graphin

      - name: Verify the binary
        env:
          VER: ${{ inputs.version }}
        run: |
          set -eu
          ./graphin version
          ./graphin version --json > v.json
          cat v.json
          # A binary reporting "dev" means -ldflags silently missed its target
          # — the exact accident `var version` exists to prevent.
          jq -e --arg v "$VER" --arg a "${{ matrix.goarch }}" \
            '.version == $v and .arch == $a and .os == "linux" and .semantic_supported == true' \
            v.json > /dev/null
          rm v.json

          # The floor is asserted, not printed — but be clear about what this
          # can and cannot catch. bullseye's glibc only *provides* symbols up
          # to 2.31, so while this container stays bullseye the check cannot
          # fire no matter what the dependencies do. (Measured on v0.2.0: the
          # real floor is 2.17, well under the ceiling.)
          #
          # Its job is to be a tripwire on the container itself. Debian 11 LTS
          # ends 2026-08-31 and the pressure to "just move to bookworm" will be
          # real; that silently raises the floor to 2.36 and drops RHEL 9 and
          # AL2023 (2.34), and nobody would notice until a user's exec fails
          # with a glibc version error. Then this fires.
          MAX=2.31
          floor="$(objdump -T graphin | sed -n 's/.*GLIBC_\([0-9.]*\).*/\1/p' | sort -uV | tail -1)"
          [ -n "$floor" ] || { echo "::error::no GLIBC_ symbols in the binary — objdump output changed shape"; exit 1; }
          echo "glibc floor: $floor (max $MAX)"
          if [ "$(printf '%s\n%s\n' "$floor" "$MAX" | sort -V | tail -1)" != "$MAX" ]; then
            echo "::error::glibc floor rose to ${floor}, above the ${MAX} this release promises. Something new links a newer symbol; find it before shipping — RHEL 9 and AL2023 are at 2.34 and would break."
            exit 1
          fi

      - name: Package
        env:
          VER: ${{ inputs.version }}
        run: tar -czf "graphin_${VER}_linux_${{ matrix.goarch }}.tar.gz" graphin

      - uses: actions/upload-artifact@v4
        with:
          name: graphin-linux-${{ matrix.goarch }}
          path: graphin_*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # The rag behavior benchmark is a RELEASE GATE, but not here: it runs at
  # the Claude Code level before this workflow is ever dispatched (owner
  # decision, 2026-09-01 — no API-billed CI benchmark). `score --gate 0.80`
  # records a commit-bound pass marker, a session hook refuses the dispatch
  # command without one, and the release agent verifies it as step 1. See
  # docs/rag-bench-spec.md §8. CI still enforces the rubric's change control
  # (rag-bench-guard in ci.yml).
  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Validate version
        env:
          VER: ${{ inputs.version }}
        run: |
          set -eu
          case "$VER" in
            v*) echo "::error::drop the leading v — pass 1.0.0, not $VER"; exit 1 ;;
          esac
          echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || {
            echo "::error::'$VER' is not a semver version"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Refuse to reuse a tag
        env:
          VER: ${{ inputs.version }}
        run: |
          set -eu
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "::error::tag v$VER already exists"; exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        env:
          VER: ${{ inputs.version }}
        run: |
          set -eu
          cd dist
          sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

      # One file is the integrity pin, the platform support table, the version
      # stamp and the reinstall trigger at once: install.sh compares it byte for
      # byte against the installed copy, so any change here forces a reinstall.
      - name: Write install manifest
        env:
          VER: ${{ inputs.version }}
        run: |
          set -eu
          amd="graphin_${VER}_linux_amd64.tar.gz"
          arm="graphin_${VER}_linux_arm64.tar.gz"
          mkdir -p plugin/graphin/install
          jq -n \
            --arg version "$VER" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg tag "v$VER" \
            --arg amd "$amd" --arg amdsha "$(sha256sum "dist/$amd" | cut -d' ' -f1)" \
            --arg arm "$arm" --arg armsha "$(sha256sum "dist/$arm" | cut -d' ' -f1)" \
            --arg mingo "$(awk '/^go /{print $2; exit}' go.mod)" \
            '{
               schema: 1,
               version: $version,
               repo: $repo,
               tag: $tag,
               platforms: {
                 "linux/amd64": { asset: $amd, sha256: $amdsha, bin: "graphin" },
                 "linux/arm64": { asset: $arm, sha256: $armsha, bin: "graphin" }
               },
               go_install: { module: ("github.com/" + $repo + "/cmd/graphin"), min_go: $mingo },
               notes: {
                 "darwin/arm64": "no release binary; the go_install fallback builds one and semantic search works (ORT is pinned for this platform)",
                 "darwin/amd64": "no onnxruntime 1.26.0 build exists; semantic search unavailable"
               }
             }' > plugin/graphin/install/manifest.json
          cat plugin/graphin/install/manifest.json

      - name: Stamp the plugin version
        env:
          VER: ${{ inputs.version }}
        run: |
          set -eu
          p=plugin/graphin/.claude-plugin/plugin.json
          if [ ! -f "$p" ]; then
            echo "::notice::$p does not exist yet (Phase 4) — skipping the version bump"
            exit 0
          fi
          tmp=$(mktemp)
          jq --arg v "$VER" '.version = $v' "$p" > "$tmp"
          mv "$tmp" "$p"
          cat "$p"

      - name: Commit and tag
        env:
          VER: ${{ inputs.version }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/graphin/install/manifest.json
          [ -f plugin/graphin/.claude-plugin/plugin.json ] \
            && git add plugin/graphin/.claude-plugin/plugin.json
          git commit -m "release: v$VER — 설치 매니페스트·플러그인 버전 갱신"
          git tag -a "v$VER" -m "v$VER"
          git push origin HEAD:main
          git push origin "v$VER"

      # The generated notes summarise commits, which is exactly the wrong
      # register for the one thing a user needs at upgrade time: whether this
      # costs them anything. The on-disk formats are fail-soft — a changed
      # shard or lexical snapshot is deleted and rebuilt rather than breaking
      # anything — so the cost is a full re-index, which is invisible in a
      # commit list and very visible in a session. --notes is prepended to the
      # generated body by the API, so the prelude stays on top.
      - name: Publish release
        env:
          VER: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          set -- dist/graphin_*.tar.gz dist/SHA256SUMS --title "v$VER" --generate-notes
          if [ -n "${NOTES:-}" ]; then
            set -- "$@" --notes "$NOTES"
          fi
          gh release create "v$VER" "$@"

  # A push made with GITHUB_TOKEN does not trigger workflows. GitHub does that
  # to stop workflows from looping, and the consequence here is specific and
  # bad: the commit this workflow just made — the one that rewrites the
  # manifest and stamps the plugin version — never gets a CI run. Measured on
  # v0.2.1: `gh run list --commit <sha>` came back empty.
  #
  # So the two checks that exist for exactly this commit (ci.yml's
  # install-smoke and its plugin-versions guard) would never see it, leaving
  # the install path unverified at the one moment a manifest and its assets
  # could first disagree. The release verifies itself instead.
  #
  # Checked out at the tag, not at main: main can move while this runs, and
  # the thing under test is the tree that was released.
  verify:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    container:
      image: debian:bullseye
    steps:
      - name: Prerequisites
        run: |
          set -eu
          # Same bullseye-EOL fallback as the build job above; see its comment
          # for why bookworm is not the answer.
          if ! apt-get update; then
            echo "::notice::bullseye has left the mirrors — falling back to archive.debian.org"
            printf '%s\n' \
              'deb http://archive.debian.org/debian bullseye main' \
              'deb http://archive.debian.org/debian-security bullseye-security main' \
              > /etc/apt/sources.list
            rm -f /etc/apt/sources.list.d/*.list || true
            apt-get -o Acquire::Check-Valid-Until=false update
          fi
          apt-get install -y --no-install-recommends ca-certificates curl git jq

      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Install the release that was just published
        run: sh scripts/install-smoke.sh "$PWD/plugin/graphin" "${{ matrix.arch }}"

      # The invariant ci.yml enforces on every other commit, enforced here on
      # the one commit ci.yml cannot see.
      - name: plugin.json and install manifest must agree
        run: |
          set -eu
          pv="$(jq -r '.version // empty' plugin/graphin/.claude-plugin/plugin.json)"
          mv="$(jq -r '.version // empty' plugin/graphin/install/manifest.json)"
          if [ "$pv" != "${{ inputs.version }}" ] || [ "$mv" != "${{ inputs.version }}" ]; then
            echo "::error::released v${{ inputs.version }} but the tagged tree says plugin.json=${pv} manifest=${mv}"
            exit 1
          fi
          echo "v${{ inputs.version }} — plugin.json, manifest and tag agree"
