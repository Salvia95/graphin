name: Release

# ─────────────────────────────────────────────────────────────────────────────
# workflow_dispatch, NOT a tag trigger. Do not "fix" this.
#
# The plugin's install/manifest.json has to carry the SHA256 of release assets
# that do not exist until this workflow builds them, and the marketplace serves
# the plugin from the *tagged* tree. A tag trigger is therefore a chicken-and-egg:
# the tag would have to exist before the hashes it must contain.
#
# So the order is inverted on purpose: build → hash → write the manifest →
# commit → tag that commit → publish. The assets are built from the tag's
# *parent* commit. The only difference between the two trees is the manifest and
# the plugin version string, and neither reaches the compiler.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, no leading v (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-22.04
          # Native arm64 runner. Cross-compilation is not an option here:
          # go-tree-sitter and five grammar bindings compile vendored C through
          # cgo, and onnxruntime_go links -ldl, so CGO_ENABLED=1 plus a real C
          # toolchain per target is mandatory.
          - goarch: arm64
            runner: ubuntu-22.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    # glibc floor, the most likely field failure. Building on the runner image
    # itself (Ubuntu 22.04, glibc 2.35) would already break RHEL 9 and AL2023,
    # both on 2.34. bullseye's 2.31 clears every currently supported distro.
    container:
      image: debian:bullseye

    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git jq xz-utils
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "1"
          VER: ${{ inputs.version }}
        run: |
          set -eu
          # Command-line variables override the Makefile's git-describe
          # defaults, so the release stamp is exactly the dispatched version.
          # Build flags themselves stay defined in one place: the Makefile.
          # (It must never grow -extldflags -static — onnxruntime is dlopen'd.)
          make build \
            VERSION="$VER" \
            COMMIT="$(echo "$GITHUB_SHA" | cut -c1-7)" \
            BUILDDATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mv bin/graphin ./graphin

      - name: Verify the binary
        env:
          VER: ${{ inputs.version }}
        run: |
          set -eu
          ./graphin version
          ./graphin version --json > v.json
          cat v.json
          # A binary reporting "dev" means -ldflags silently missed its target
          # — the exact accident `var version` exists to prevent.
          jq -e --arg v "$VER" --arg a "${{ matrix.goarch }}" \
            '.version == $v and .arch == $a and .os == "linux" and .semantic_supported == true' \
            v.json > /dev/null
          echo "glibc floor: $(objdump -T graphin | sed -n 's/.*GLIBC_\([0-9.]*\).*/\1/p' | sort -uV | tail -1)"
          rm v.json

      - name: Package
        env:
          VER: ${{ inputs.version }}
        run: tar -czf "graphin_${VER}_linux_${{ matrix.goarch }}.tar.gz" graphin

      - uses: actions/upload-artifact@v4
        with:
          name: graphin-linux-${{ matrix.goarch }}
          path: graphin_*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Validate version
        env:
          VER: ${{ inputs.version }}
        run: |
          set -eu
          case "$VER" in
            v*) echo "::error::drop the leading v — pass 1.0.0, not $VER"; exit 1 ;;
          esac
          echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || {
            echo "::error::'$VER' is not a semver version"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Refuse to reuse a tag
        env:
          VER: ${{ inputs.version }}
        run: |
          set -eu
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "::error::tag v$VER already exists"; exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        env:
          VER: ${{ inputs.version }}
        run: |
          set -eu
          cd dist
          sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

      # One file is the integrity pin, the platform support table, the version
      # stamp and the reinstall trigger at once: install.sh compares it byte for
      # byte against the installed copy, so any change here forces a reinstall.
      - name: Write install manifest
        env:
          VER: ${{ inputs.version }}
        run: |
          set -eu
          amd="graphin_${VER}_linux_amd64.tar.gz"
          arm="graphin_${VER}_linux_arm64.tar.gz"
          mkdir -p plugin/graphin/install
          jq -n \
            --arg version "$VER" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg tag "v$VER" \
            --arg amd "$amd" --arg amdsha "$(sha256sum "dist/$amd" | cut -d' ' -f1)" \
            --arg arm "$arm" --arg armsha "$(sha256sum "dist/$arm" | cut -d' ' -f1)" \
            --arg mingo "$(awk '/^go /{print $2; exit}' go.mod)" \
            '{
               schema: 1,
               version: $version,
               repo: $repo,
               tag: $tag,
               platforms: {
                 "linux/amd64": { asset: $amd, sha256: $amdsha, bin: "graphin" },
                 "linux/arm64": { asset: $arm, sha256: $armsha, bin: "graphin" }
               },
               go_install: { module: ("github.com/" + $repo + "/cmd/graphin"), min_go: $mingo },
               notes: {
                 "darwin/arm64": "no release binary; the go_install fallback builds one and semantic search works (ORT is pinned for this platform)",
                 "darwin/amd64": "no onnxruntime 1.26.0 build exists; semantic search unavailable"
               }
             }' > plugin/graphin/install/manifest.json
          cat plugin/graphin/install/manifest.json

      - name: Stamp the plugin version
        env:
          VER: ${{ inputs.version }}
        run: |
          set -eu
          p=plugin/graphin/.claude-plugin/plugin.json
          if [ ! -f "$p" ]; then
            echo "::notice::$p does not exist yet (Phase 4) — skipping the version bump"
            exit 0
          fi
          tmp=$(mktemp)
          jq --arg v "$VER" '.version = $v' "$p" > "$tmp"
          mv "$tmp" "$p"
          cat "$p"

      - name: Commit and tag
        env:
          VER: ${{ inputs.version }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/graphin/install/manifest.json
          [ -f plugin/graphin/.claude-plugin/plugin.json ] \
            && git add plugin/graphin/.claude-plugin/plugin.json
          git commit -m "release: v$VER — 설치 매니페스트·플러그인 버전 갱신"
          git tag -a "v$VER" -m "v$VER"
          git push origin HEAD:main
          git push origin "v$VER"

      - name: Publish release
        env:
          VER: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "v$VER" \
            dist/graphin_*.tar.gz dist/SHA256SUMS \
            --title "v$VER" \
            --generate-notes
